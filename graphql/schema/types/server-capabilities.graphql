"""
ServerCapabilities is the authenticated NG-to-NG capability handshake. Clients
use edition/apiVersion/features to decide which NG surfaces to call; an
unreachable query or absent feature is a version-skew/probe-failure signal, not
an upstream fallback path.
"""
type ServerCapabilities {
  "Build variant. \"ng\" is the only supported Stash NG edition."
  edition: String!
  "NG client-facing API revision, bumped independently of SystemStatus.appSchema."
  apiVersion: Int!
  "Fork-only capabilities clients may rely on, e.g. deletedSince, moveFolder, folderCounts, webhooks."
  features: [String!]!
  "Retention horizon for the deletedSince tombstone feed, in days. Tombstones older than this may be pruned; a client whose last sync is older than this must full-resync rather than trust the incremental feed. 0 means retention is disabled (tombstones are kept indefinitely)."
  deletedSinceRetentionDays: Int!
}
