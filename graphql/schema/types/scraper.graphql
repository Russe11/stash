enum ScrapeType {
  "From text query"
  NAME
  "From existing object"
  FRAGMENT
  "From URL"
  URL
}

"Type of the content a scraper generates"
enum ScrapeContentType {
  GALLERY
  IMAGE
  MOVIE
  GROUP
  PERFORMER
  SCENE
}

"Scraped Content is the forming union over the different scrapers"
union ScrapedContent =
    ScrapedStudio
  | ScrapedTag
  | ScrapedScene
  | ScrapedGallery
  | ScrapedImage
  | ScrapedMovie
  | ScrapedGroup
  | ScrapedPerformer

type ScraperSpec {
  "URLs matching these can be scraped with"
  urls: [String!]
  supported_scrapes: [ScrapeType!]!
}

type Scraper {
  id: ID!
  name: String!
  "Details for performer scraper"
  performer: ScraperSpec
  "Details for scene scraper"
  scene: ScraperSpec
  "Details for gallery scraper"
  gallery: ScraperSpec
  "Details for image scraper"
  image: ScraperSpec
  "Details for movie scraper"
  movie: ScraperSpec @deprecated(reason: "use group")
  "Details for group scraper"
  group: ScraperSpec
}

type ScrapedStudio {
  "Set if studio matched"
  stored_id: ID
  name: String!
  url: String @deprecated(reason: "use urls")
  urls: [String!]
  parent: ScrapedStudio
  image: String
  details: String
  "Aliases must be comma-delimited to be parsed correctly"
  aliases: String
  tags: [ScrapedTag!]

  remote_site_id: String
}

type ScrapedTag {
  "Set if tag matched"
  stored_id: ID
  name: String!
  description: String
  alias_list: [String!]
  parent: ScrapedTag
  "Remote site ID, if applicable"
  remote_site_id: String
}

type ScrapedScene {
  title: String
  code: String
  details: String
  director: String
  url: String @deprecated(reason: "use urls")
  urls: [String!]
  date: String

  "This should be a base64 encoded data URL"
  image: String

  file: SceneFileType # Resolver
  studio: ScrapedStudio
  tags: [ScrapedTag!]
  performers: [ScrapedPerformer!]
  movies: [ScrapedMovie!] @deprecated(reason: "use groups")
  groups: [ScrapedGroup!]

  remote_site_id: String
  duration: Int
}

input ScrapedSceneInput {
  title: String
  code: String
  details: String
  director: String
  url: String @deprecated(reason: "use urls")
  urls: [String!]
  date: String

  # no image, file, duration or relationships

  remote_site_id: String
}

type ScrapedGallery {
  title: String
  code: String
  details: String
  photographer: String
  url: String @deprecated(reason: "use urls")
  urls: [String!]
  date: String

  studio: ScrapedStudio
  tags: [ScrapedTag!]
  performers: [ScrapedPerformer!]
}

input ScrapedGalleryInput {
  title: String
  code: String
  details: String
  photographer: String
  url: String @deprecated(reason: "use urls")
  urls: [String!]
  date: String

  # no studio, tags or performers
}

type ScrapedImage {
  title: String
  code: String
  details: String
  photographer: String
  urls: [String!]
  date: String
  studio: ScrapedStudio
  tags: [ScrapedTag!]
  performers: [ScrapedPerformer!]
}

input ScrapedImageInput {
  title: String
  code: String
  details: String
  urls: [String!]
  date: String
}

input ScraperSourceInput {
  "Scraper ID to scrape with."
  scraper_id: ID
}

type ScraperSource {
  "Scraper ID to scrape with."
  scraper_id: ID
}

input ScrapeSingleSceneInput {
  "Instructs to query by string"
  query: String
  "Instructs to query by scene fingerprints"
  scene_id: ID
  "Instructs to query by scene fragment"
  scene_input: ScrapedSceneInput
}

input ScrapeMultiScenesInput {
  "Instructs to query by scene fingerprints"
  scene_ids: [ID!]
}

input ScrapeSingleStudioInput {
  """
  Query can be either a name or a Stash ID
  """
  query: String
}

input ScrapeSingleTagInput {
  """
  Query can be either a name or a Stash ID
  """
  query: String
}

input ScrapeSinglePerformerInput {
  "Instructs to query by string"
  query: String
  "Instructs to query by performer id"
  performer_id: ID
  "Instructs to query by performer fragment"
  performer_input: ScrapedPerformerInput
}

input ScrapeMultiPerformersInput {
  "Instructs to query by scene fingerprints"
  performer_ids: [ID!]
}

input ScrapeSingleGalleryInput {
  "Instructs to query by string"
  query: String
  "Instructs to query by gallery id"
  gallery_id: ID
  "Instructs to query by gallery fragment"
  gallery_input: ScrapedGalleryInput
}

input ScrapeSingleImageInput {
  "Instructs to query by string"
  query: String
  "Instructs to query by image id"
  image_id: ID
  "Instructs to query by image fragment"
  image_input: ScrapedImageInput
}

input ScrapeSingleMovieInput {
  "Instructs to query by string"
  query: String
  "Instructs to query by movie id"
  movie_id: ID
  "Instructs to query by movie fragment"
  movie_input: ScrapedMovieInput
}

input ScrapeSingleGroupInput {
  "Instructs to query by string"
  query: String
  "Instructs to query by group id"
  group_id: ID
  "Instructs to query by group fragment"
  group_input: ScrapedGroupInput
}
